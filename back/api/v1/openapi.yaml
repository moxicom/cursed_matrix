openapi: 3.0.3

# The contract is the source of truth: back/ generates its server interface from
# this file, so a handler that does not match it fails to compile. docs/API.md
# explains the decisions behind it; this file is what the code is held to.
#
# Phase 2 covers authentication and the account. The task, graph, activity and
# leaderboard endpoints of API.md §4-12 arrive with phase 3.

info:
  title: cursed_matrix API
  version: 0.2.0
  description: |
    Every timestamp is ISO-8601 with an explicit UTC offset. Calendar days are
    YYYY-MM-DD strings computed in the user's timezone, never the server's.
    The server returns codes and parameters, never rendered prose: the client
    renders them in EN or RU.

servers:
  - url: /api/v1

tags:
  - name: auth
    description: Registration, sign-in and token rotation.
  - name: billing
    description: Plans and what buying one does.
  - name: account
    description: The signed-in user and their settings.
  - name: tasks
    description: The board.
  - name: tags
    description: The user's own labels.
  - name: links
    description: The network drawn over the tasks.
  - name: leaderboard
    description: The public ranking.
  - name: achievements
    description: What the user has earned.
  - name: search
    description: The command palette.
  - name: graph
    description: The network as the canvas draws it.
  - name: activity
    description: What the user did, by their own calendar day.

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account and sign in
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: The account, with the session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: The account, with the session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: |
            Wrong password, or no such account — deliberately the same answer,
            so the endpoint cannot be used to learn which usernames are taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the token pair
      operationId: refresh
      description: |
        The refresh cookie is the credential; there is no body. A token that was
        already consumed is a replay: the server revokes every refresh token of
        that account and answers 401.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: New cookies are set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out on this device
      operationId: logout
      description: Consumes the refresh token and clears the cookies.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: |
            Cleared. The same answer whether or not a session was there.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Sign out everywhere
      operationId: logoutAll
      description: |
        Revokes every refresh token of the account. Other devices keep working
        until their access token expires, which is what bounds the damage of a
        stolen cookie to fifteen minutes.
      responses:
        "204":
          description: Revoked.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookies" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }

  /tasks:
    get:
      tags: [tasks]
      summary: The board
      operationId: listTasks
      description: |
        Every task the filter matches, subtasks included, each with its tag
        names. Not paginated: the board and the graph need the whole working
        set, which the free plan caps at 35 active tasks. Completed tasks are
        never deleted, though, so a result is capped at 500 and says when it
        was cut.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/StatusFilter" } }
        - { name: quadrants, in: query, schema: { type: array, items: { $ref: "#/components/schemas/Quadrant" } } }
        - { name: colors, in: query, schema: { type: array, items: { $ref: "#/components/schemas/TaskColor" } } }
        - { name: tags, in: query, schema: { type: array, items: { type: string } } }
        - { name: deadline, in: query, schema: { $ref: "#/components/schemas/DeadlineWindow" } }
        - { name: topology, in: query, schema: { $ref: "#/components/schemas/TopologyFilter" } }
        - { name: query, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/SortField" } }
        - { name: direction, in: query, schema: { $ref: "#/components/schemas/SortDirection" } }
      responses:
        "200":
          description: The matching tasks.
          content:
            application/json:
              schema:
                type: object
                required: [tasks, links, truncated]
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
                  links:
                    type: array
                    description: |
                      Every link the user holds. They travel with the board
                      because a card shows a link count and the topology filter
                      needs them; fetched separately the two answers could
                      disagree.
                    items: { $ref: "#/components/schemas/TaskLink" }
                  truncated:
                    type: boolean
                    description: |
                      True when the result hit the server cap of 500 tasks and
                      more exist. Narrow the filter to see the rest.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [tasks]
      summary: Create a task
      operationId: createTask
      description: |
        The task lands at the end of the quadrant it was created in. Position
        is the server's to decide; the client cannot ask for one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskDraft" }
      responses:
        "201":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/QuotaReached" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [tasks]
      summary: Edit a task
      operationId: updateTask
      description: |
        Only the fields the body mentions change. `deadlineAt` sent as null
        clears the deadline; left out, it stays. Quadrant and position are not
        editable here — moving a task is its own operation, because it changes
        two things at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPatch" }
      responses:
        "200":
          description: The task as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The task is completed, and a completed task is frozen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [tasks]
      summary: Delete a task
      operationId: deleteTask
      description: |
        A logical delete. The row stays so the XP ledger and the activity
        history keep referring to something real; the task leaves the user's
        views, and any XP it was paid is withdrawn by a compensating entry.
        Completed subtasks go with their parent; unfinished ones block the
        request.
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema:
                type: object
                required: [deletedIds]
                properties:
                  deletedIds:
                    type: array
                    items: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The task still has unfinished subtasks. Finish, promote or delete
            them first — they are open work, and the server will not take them
            down on the client's behalf.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{taskId}/move:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Move a task
      operationId: moveTask
      description: |
        The client names a place, never a position: two clients dragging at
        once would compute the same number from different starting points and
        the second write would land in the wrong place. Give `beforeTaskId` or
        `afterTaskId`, or neither to append. The server assigns the position
        and renumbers the quadrant when a gap is used up. Moving a subtask out
        with this call promotes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Every task whose position changed, the moved one last.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The task is completed. The quadrant it was completed in is what
            priced its XP and is frozen with the snapshot; reopen it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}/promote:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Turn a subtask into a task
      operationId: promoteTask
      description: |
        The parent relation is dropped and the task takes a place at the end of
        a quadrant — its former parent's unless the body names another. Tags,
        colour, deadline and the XP snapshot survive, so a completed subtask
        can be promoted without disturbing what it earned.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                quadrant: { $ref: "#/components/schemas/Quadrant" }
      responses:
        "200":
          description: Every task whose position changed, the promoted one last.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The task has no parent, so there is nothing to promote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{taskId}/complete:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Complete a task
      operationId: completeTask
      description: |
        Marks the task done and, for a parent, every active subtask under it
        with `completedVia: PARENT_CASCADE` and the same `completedAt`. XP is
        priced from the effective quadrant — a subtask's is its parent's — and
        frozen on the task, so a later change to the configuration never
        rewrites what was earned. Status, snapshot, ledger entry and totals are
        one transaction.
      responses:
        "200":
          description: Everything the completion changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Already completed, or a subtask whose parent cannot be read, which
            must not be priced at a guessed quadrant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{taskId}/reopen:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Return a task to work
      operationId: reopenTask
      description: |
        Clears the completion and its snapshot, and withdraws the XP with a
        compensating negative entry; the original entry is never deleted, so
        the history stays auditable. Subtasks completed by a cascade are not
        reopened.
      responses:
        "200":
          description: The task, with the withdrawn XP as a negative amount.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}/subtasks:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tasks]
      summary: Add a subtask
      operationId: createSubtask
      description: |
        A subtask has no quadrant of its own — it answers to its parent's — and
        cannot have subtasks itself. Subtasks count against the plan's task
        quota like any other task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubtaskDraft" }
      responses:
        "201":
          description: The subtask.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/QuotaReached" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tags:
    get:
      tags: [tags]
      summary: The user's labels
      operationId: listTags
      description: |
        Sorted by how many tasks carry each, descending. The count comes from
        the server because the client's collapsing tag filter decides what to
        show from it, over tasks it may not be holding.
      responses:
        "200":
          description: Every label the user has.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tasks/{taskId}/tags:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [tags]
      summary: Put a label on a task
      operationId: attachTag
      description: |
        Creates the label for this user if it is new and attaches it. Names are
        unique per user, case-insensitively, so asking for "Backend" when
        "backend" exists attaches the existing one rather than making a second
        label the user would read as a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 24 }
      responses:
        "200":
          description: The label now on the task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tasks/{taskId}/tags/{tagId}:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [tags]
      summary: Take a label off a task
      operationId: detachTag
      description: |
        A label left on no tasks is forgotten, which the client cannot observe
        and does not need to.
      responses:
        "204": { description: Detached. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }

  /links:
    post:
      tags: [links]
      summary: Join two tasks
      operationId: createLink
      description: |
        `type` defaults to `RELATED`. RELATED and CONNECTED_TO say nothing
        about which end is which, so the pair is normalised and A→B is the same
        link as B→A; BLOCKS and DEPENDS_ON keep their direction. A parent and
        its own subtask cannot be linked — the graph already draws that
        relation, and a second edge would say it twice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkDraft" }
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/QuotaReached" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This pair is already joined that way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: A task cannot be linked to itself.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /links/{linkId}:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [links]
      summary: Change what a link means
      operationId: updateLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: "#/components/schemas/LinkType" }
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The new meaning collides with a link already joining this pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [links]
      summary: Break a link
      operationId: deleteLink
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      tags: [search]
      summary: Find a task
      operationId: search
      description: |
        Title, description and tag names, across active and archived tasks —
        someone looking for what they finished is exactly who needs this.
        `matchedField` and `matchedText` are decided by the server, because
        only the server knows why the row matched; the client shows the snippet
        without searching the text again.
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 14 } }
      responses:
        "200":
          description: What matched, active work first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /plans:
    get:
      tags: [billing]
      summary: What the plans cost
      operationId: listPlans
      description: |
        Public, because the pricing page is one of the two pages that does not
        need an account. Prices are set per market rather than converted, so
        each carries its own currency. The limits come from the same place the
        quotas read them, so the page cannot promise a number the server does
        not enforce.

        `billingEnabled` false means no payment provider is wired: buying
        grants the plan outright, which is what makes the product usable end
        to end before a provider is chosen.
      responses:
        "200":
          description: The plans.
          content:
            application/json:
              schema:
                type: object
                required: [billingEnabled, plans]
                properties:
                  billingEnabled: { type: boolean }
                  plans: { type: array, items: { $ref: "#/components/schemas/PlanOffer" } }

  /billing/checkout:
    post:
      tags: [billing]
      summary: Buy a plan
      operationId: checkout
      description: |
        With billing off, grants the plan there and then and answers with the
        new subscription. The access token still carries the old plan, so the
        client refreshes it before the change is visible everywhere.

        With billing on and no provider wired, answers 503 rather than
        accepting an instruction to charge that nothing will act on.

        Reachable with a lapsed plan on purpose: the one thing someone whose
        subscription ran out must be able to do is pay.
      responses:
        "200":
          description: The subscription the account now holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "503":
          description: Billing is on, but no provider is wired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/export:
    post:
      tags: [account]
      summary: Take your data away
      operationId: exportAccount
      description: |
        Everything the account holds, in one document: the account itself, its
        settings and figures, every task including the deleted ones, the links,
        the labels and the achievements. Read in one transaction, so the pieces
        agree with each other.

        Synchronous, which the free plan's size makes reasonable. An account
        large enough to need a job would answer 202 with a link instead, and
        the two shapes are told apart by the status.
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }

  /me/delete:
    post:
      tags: [account]
      summary: Close the account
      operationId: deleteAccount
      description: |
        Asks for the password again: `docs/API.md` calls for a token sent by
        email, but an address is optional in this product — the account is
        identified by its username — so most accounts have nowhere to send
        one. The password is something only the owner knows, which is what
        stops a borrowed session from ending an account.

        The delete is logical. Nothing earned is erased, because the XP ledger,
        the activity history and other people's leaderboard standings all refer
        to the row; what ends is access, and every ranking already excludes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Closed. }
        "401":
          description: No session, or the password does not match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/CSRFRejected" }

  /leaderboard:
    get:
      tags: [leaderboard]
      summary: The public ranking
      operationId: leaderboard
      description: |
        Only users who chose to appear are counted, so someone hidden occupies
        no rank and pushes nobody down. Weekly and monthly figures are sums of
        XP transactions inside the period, computed in UTC so that two people's
        weeks are the same week. Ranks are dense and ties are broken by who
        reached the total first, so the order is stable between requests.

        `me` comes back even when the asking user is off the page. When they
        are hidden, `visible` is false and the rank is null — publicly it does
        not exist.
      parameters:
        - { name: period, in: query, schema: { $ref: "#/components/schemas/LeaderboardPeriod" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: One page of the ranking.
          content:
            application/json:
              schema:
                type: object
                required: [entries, me]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/LeaderboardEntry" } }
                  me: { $ref: "#/components/schemas/LeaderboardStanding" }
                  nextOffset: { type: integer, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /achievements:
    get:
      tags: [achievements]
      summary: The catalogue and the user's standing
      operationId: listAchievements
      description: |
        Names and descriptions are not returned, only the code: the client
        localises it, so the server never has to know which language the user
        reads. Progress is reported for every entry, earned or not, because
        the screen sorts by how close the user is.
      responses:
        "200":
          description: Every achievement there is.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Achievement" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /graph:
    get:
      tags: [graph]
      summary: The network
      operationId: getGraph
      description: |
        The same filters as the board, applied on the server: after a year of
        use this is thousands of nodes, and shipping all of them is what makes
        the force simulation unusable. A node's quadrant is the effective one —
        a subtask answers to its parent's — and the two counts come with it
        because the canvas sizes a node by them.

        Edges are of two kinds: the links the user made, and the parent
        relation the server maintains, which is not a link row and has a
        derived id.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/StatusFilter" } }
        - { name: quadrants, in: query, schema: { type: array, items: { $ref: "#/components/schemas/Quadrant" } } }
        - { name: colors, in: query, schema: { type: array, items: { $ref: "#/components/schemas/TaskColor" } } }
        - { name: tags, in: query, schema: { type: array, items: { type: string } } }
        - { name: deadline, in: query, schema: { $ref: "#/components/schemas/DeadlineWindow" } }
        - { name: topology, in: query, schema: { $ref: "#/components/schemas/TopologyFilter" } }
        - { name: query, in: query, schema: { type: string } }
      responses:
        "200":
          description: The snapshot the canvas renders.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, edges]
                properties:
                  nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
                  edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /activity/heatmap:
    get:
      tags: [activity]
      summary: A year of activity
      operationId: activityHeatmap
      description: |
        Exactly 365 entries ending today in the user's timezone, empty days
        included: the client renders a fixed grid and must not have to infer a
        gap. Only creating and completing count — levelling up and unlocking
        follow from work already counted, and counting them again would colour
        a day twice for one action.
      responses:
        "200":
          description: The grid and its totals.
          content:
            application/json:
              schema:
                type: object
                required: [days, totals]
                properties:
                  days: { type: array, items: { $ref: "#/components/schemas/ActivityDay" } }
                  totals:
                    type: object
                    required: [created, completed]
                    properties:
                      created: { type: integer }
                      completed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /activity/events:
    get:
      tags: [activity]
      summary: What the user did
      operationId: activityEvents
      description: |
        Newest first, paged by a cursor rather than an offset: events keep
        arriving while someone reads, and counting from the start would show
        one twice or skip one. `type` is a code and `detail` carries
        parameters, not a sentence, so the client renders the row in either
        language.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of the history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ActivityEvent" } }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /activity/stats:
    get:
      tags: [activity]
      summary: The figures above the heatmap
      operationId: activityStats
      description: |
        Created and completed over the same 365 days the heatmap covers, the
        two streaks, lifetime XP with its level, and how many tasks are open
        against how many are finished.
      responses:
        "200":
          description: The counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /activity/graph-opened:
    post:
      tags: [activity]
      summary: Note that the graph was opened
      operationId: graphOpened
      description: |
        Feeds no heatmap and no XP. The only thing that asks is the exploration
        achievement, which counts the distinct days the user went looking.
      responses:
        "204": { description: Noted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }

  /me:
    get:
      tags: [account]
      summary: The signed-in account
      operationId: getMe
      description: |
        What the client boots from: it drives the header, the subscription gate
        and the profile. `level` is derived from `lifetimeXp` by the server; the
        client mirrors the formula for display only.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    patch:
      tags: [account]
      summary: Change account preferences
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: The account, with the new preferences applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CSRFRejected" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: cm_access
      description: |
        A signed JWT the page cannot read. Verified by signature, so an
        authenticated request touches neither PostgreSQL nor Redis.
    refreshCookie:
      type: apiKey
      in: cookie
      name: cm_refresh
      description: |
        The opaque id of a server-side record, scoped to /api/v1/auth and
        SameSite=Strict. Revocable, which is what the JWT cannot be.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The value of the page-readable cm_csrf cookie. Required on every unsafe
        method, because a browser attaches cookies whether or not the page meant
        to send them.

  headers:
    SessionCookies:
      description: |
        Sets or clears cm_access (HttpOnly, SameSite=Lax, Path=/api),
        cm_refresh (HttpOnly, SameSite=Strict, Path=/api/v1/auth) and cm_csrf.
      schema:
        type: string

  responses:
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CSRFRejected:
      description: The CSRF header is missing or does not match the cookie.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Valid JSON, invalid content.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts from this address or for this account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such task for this account. A task belonging to someone else answers
        the same way as one that does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuotaReached:
      description: |
        The plan's limit is reached. Nothing existing is affected; completing
        or deleting a task frees a slot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              description: |
                Stable and language-independent. The client renders it; the
                server never sends prose.
              example: VALIDATION_FAILED
            params:
              type: object
              additionalProperties: true
              description: Values for the client's message template.
            requestId:
              type: string
              description: What the user reports when something goes wrong.

    RegisterRequest:
      type: object
      required: [username, password, timezone]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          description: |
            The credential the account signs in with. Case-insensitive and
            unique: "Operator" and "operator" are the same account.
          example: nullptr_ok
        email:
          type: string
          format: email
          nullable: true
          description: |
            Optional. Nothing in the product sends mail today; an address is
            what a future calendar integration will match the account by, and
            what a password reset would need. Asking for one to get past the
            form only produces invented addresses, which look deliverable and
            are not.
        password:
          type: string
          format: password
          minLength: 12
        timezone:
          type: string
          description: |
            An IANA identifier. Every calendar-day rule — streak days, heatmap
            buckets, date-only deadlines — is computed in it. An unknown zone
            falls back to UTC rather than failing the request.
          example: Europe/Moscow
        language:
          $ref: "#/components/schemas/Language"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: nullptr_ok }
        password: { type: string, format: password }
        timezone:
          type: string
          description: Sent on every sign-in, so a travelling user stays correct.
          example: Europe/Moscow

    SettingsUpdate:
      type: object
      description: Only the fields present are changed.
      properties:
        language: { $ref: "#/components/schemas/Language" }
        timezone: { type: string, example: Europe/Berlin }
        email:
          type: string
          format: email
          nullable: true
          description: |
            Adding, changing or clearing the address. Uniqueness applies only
            where there is one.
        showInLeaderboard:
          type: boolean
          description: |
            Taking part in the public ranking is voluntary. Turning it off
            removes the user from the ranking without touching their XP.

    Language:
      type: string
      enum: [EN, RU]

    Quadrant:
      type: string
      enum: [IMPORTANT_URGENT, IMPORTANT_NOT_URGENT, NOT_IMPORTANT_URGENT, NOT_IMPORTANT_NOT_URGENT]

    TaskColor:
      type: string
      enum: [NONE, CYAN, VIOLET, AMBER, ROSE, TEAL, SLATE]

    TaskStatus:
      type: string
      enum: [ACTIVE, COMPLETED]

    CompletionSource:
      type: string
      enum: [DIRECT, PARENT_CASCADE]

    StatusFilter:
      type: string
      enum: [ACTIVE, COMPLETED, ALL]

    DeadlineWindow:
      type: string
      enum: [ANY, OVERDUE, TODAY, WEEK, NONE]

    TopologyFilter:
      type: string
      enum: [ANY, LINKED, UNLINKED]

    SortField:
      type: string
      enum: [POSITION, DEADLINE, CREATED, TITLE]

    SortDirection:
      type: string
      enum: [ASC, DESC]

    PlanOffer:
      type: object
      required: [plan, prices]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        prices: { type: array, items: { $ref: "#/components/schemas/PlanPrice" } }
        activeTaskLimit:
          type: integer
          nullable: true
          description: Null means no limit; the client renders no counter for it.
        taskLinkLimit: { type: integer, nullable: true }

    PlanPrice:
      type: object
      required: [language, currency, amount]
      properties:
        language: { $ref: "#/components/schemas/Language" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount:
          type: integer
          format: int64
          description: In the currency's minor units — cents, kopecks — never a float.

    Subscription:
      type: object
      required: [plan, expired]
      properties:
        plan: { $ref: "#/components/schemas/Plan" }
        expiresAt: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }

    AccountExport:
      type: object
      required: [exportedAt, account, tasks, links, tags, achievements]
      properties:
        exportedAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/User" }
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        links: { type: array, items: { $ref: "#/components/schemas/TaskLink" } }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        achievements:
          type: array
          items:
            type: object
            required: [code, unlockedAt]
            properties:
              code: { type: string }
              unlockedAt: { type: string, format: date-time }

    LeaderboardPeriod:
      type: string
      enum: [WEEK, MONTH, ALL_TIME]

    LeaderboardEntry:
      type: object
      required: [rank, userId, username, xp, level, currentStreak, isCurrentUser]
      properties:
        rank: { type: integer }
        userId: { type: string, format: uuid }
        username: { type: string }
        avatarUrl: { type: string, nullable: true }
        xp: { type: integer, format: int64 }
        level: { type: integer, format: int32 }
        currentStreak: { type: integer, format: int32 }
        isCurrentUser: { type: boolean }

    LeaderboardStanding:
      type: object
      required: [visible, xp]
      properties:
        visible:
          type: boolean
          description: False when the user chose not to appear; the rank is then null.
        rank: { type: integer, nullable: true }
        xp: { type: integer, format: int64 }

    Achievement:
      type: object
      required: [code, category, threshold, progress, rewardXp]
      properties:
        code: { type: string }
        category: { type: string, enum: [TASKS, XP, LEVEL, STREAK, LINKS, EXPLORATION] }
        threshold: { type: integer, format: int64 }
        progress:
          type: integer
          format: int64
          description: Never past the threshold, so the ratio the screen sorts by cannot exceed one.
        rewardXp: { type: integer, format: int32 }
        unlockedAt: { type: string, format: date-time, nullable: true }

    SearchHit:
      type: object
      required: [id, title, isSubtask, status, matchedField, matchedText]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        quadrant:
          allOf: [{ $ref: "#/components/schemas/Quadrant" }]
          nullable: true
        isSubtask: { type: boolean }
        status: { $ref: "#/components/schemas/TaskStatus" }
        matchedField: { type: string, enum: [TITLE, DESCRIPTION, TAG] }
        matchedText:
          type: string
          description: |
            The title, a snippet of the description around the term, or the
            tag name with a leading #.

    GraphNode:
      type: object
      required: [id, title, status, isSubtask, tags, linkCount, subtaskCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        quadrant:
          allOf: [{ $ref: "#/components/schemas/Quadrant" }]
          nullable: true
          description: |
            The effective quadrant. Null only for a subtask whose parent
            cannot be read, which the graph shows rather than hiding.
        color: { $ref: "#/components/schemas/TaskColor" }
        isSubtask: { type: boolean }
        parentTaskId: { type: string, format: uuid, nullable: true }
        deadlineAt: { type: string, format: date-time, nullable: true }
        tags: { type: array, items: { type: string } }
        linkCount: { type: integer }
        subtaskCount: { type: integer }

    GraphEdge:
      type: object
      required: [id, source, target, kind]
      properties:
        id:
          type: string
          description: |
            A link's own id, or "p-" and the subtask's id for a parent
            relation, which has no row of its own.
        source: { type: string, format: uuid }
        target: { type: string, format: uuid }
        kind: { type: string, enum: [LINK, PARENT_CHILD] }
        type:
          allOf: [{ $ref: "#/components/schemas/LinkType" }]
          nullable: true
          description: Absent on a parent relation, which has no type.

    ActivityEvent:
      type: object
      required: [id, type, occurredAt, localDate, detail]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          description: A code the client localises, never a rendered sentence.
        occurredAt: { type: string, format: date-time }
        localDate: { type: string, format: date }
        taskId: { type: string, format: uuid, nullable: true }
        taskTitle: { type: string, nullable: true }
        detail:
          type: object
          additionalProperties: true
          description: Parameters for the client's message template.

    ActivityStats:
      type: object
      required:
        - createdLastYear
        - completedLastYear
        - currentStreak
        - longestStreak
        - lifetimeXp
        - level
        - activeTasks
        - archivedTasks
      properties:
        createdLastYear: { type: integer, format: int64 }
        completedLastYear: { type: integer, format: int64 }
        currentStreak: { type: integer, format: int32 }
        longestStreak: { type: integer, format: int32 }
        lifetimeXp: { type: integer, format: int64 }
        level: { type: integer, format: int32 }
        activeTasks: { type: integer, format: int64 }
        archivedTasks: { type: integer, format: int64 }

    ActivityDay:
      type: object
      required: [date, createdCount, completedCount, totalActivity]
      properties:
        date: { type: string, format: date }
        createdCount: { type: integer }
        completedCount: { type: integer }
        totalActivity:
          type: integer
          description: The sum the square's colour is chosen from.

    Tag:
      type: object
      required: [id, name, taskCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 24 }
        taskCount: { type: integer }

    LinkType:
      type: string
      enum: [RELATED, CONNECTED_TO, BLOCKS, DEPENDS_ON]

    LinkDraft:
      type: object
      required: [sourceTaskId, targetTaskId]
      properties:
        sourceTaskId: { type: string, format: uuid }
        targetTaskId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/LinkType" }

    TaskLink:
      type: object
      required: [id, sourceTaskId, targetTaskId, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        sourceTaskId: { type: string, format: uuid }
        targetTaskId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/LinkType" }
        createdAt: { type: string, format: date-time }

    MoveRequest:
      type: object
      required: [targetQuadrant]
      description: At most one neighbour; neither means the end of the list.
      properties:
        targetQuadrant: { $ref: "#/components/schemas/Quadrant" }
        beforeTaskId: { type: string, format: uuid }
        afterTaskId: { type: string, format: uuid }

    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }

    Progress:
      type: object
      description: |
        What one call changed. The tasks are returned so the client can
        reconcile its board without fetching it again.
      required: [tasks, xpAwarded, unlockedAchievements]
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        xpAwarded:
          type: integer
          format: int32
          description: Negative when XP was withdrawn.
        levelUp:
          type: object
          nullable: true
          description: One object however many thresholds were crossed at once.
          required: [fromLevel, toLevel]
          properties:
            fromLevel: { type: integer, format: int32 }
            toLevel: { type: integer, format: int32 }
        unlockedAchievements:
          type: array
          description: Achievement codes. Always empty until the evaluator exists.
          items: { type: string }

    TaskDraft:
      type: object
      required: [title, quadrant]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        quadrant: { $ref: "#/components/schemas/Quadrant" }
        color: { $ref: "#/components/schemas/TaskColor" }
        deadlineAt: { type: string, format: date-time, nullable: true }
        deadlineHasTime: { type: boolean }

    SubtaskDraft:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        color: { $ref: "#/components/schemas/TaskColor" }
        deadlineAt: { type: string, format: date-time, nullable: true }
        deadlineHasTime: { type: boolean }

    TaskPatch:
      type: object
      description: Every field is optional; only what is present changes.
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        color: { $ref: "#/components/schemas/TaskColor" }
        deadlineAt:
          type: string
          format: date-time
          nullable: true
          description: Null clears the deadline; absent leaves it unchanged.
        deadlineHasTime: { type: boolean }

    Task:
      type: object
      description: |
        A regular task or a subtask; parentTaskId tells them apart. quadrant is
        non-null exactly when parentTaskId is null: a subtask has none of its
        own and inherits the parent's. The four completion fields are set
        together, exactly when status is COMPLETED, and are frozen at that
        moment so a later change to the XP configuration never rewrites
        history.
      required: [id, userId, title, description, position, color, deadlineHasTime, status, createdAt, updatedAt, tags]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        parentTaskId: { type: string, format: uuid, nullable: true }
        title: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        quadrant: { allOf: [{ $ref: "#/components/schemas/Quadrant" }], nullable: true }
        position: { type: integer, format: int32 }
        color: { $ref: "#/components/schemas/TaskColor" }
        deadlineAt: { type: string, format: date-time, nullable: true }
        deadlineHasTime:
          type: boolean
          description: False means a date-only deadline, rendered without a time.
        status: { $ref: "#/components/schemas/TaskStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        xpAwarded: { type: integer, format: int32, nullable: true }
        quadrantAtCompletion: { allOf: [{ $ref: "#/components/schemas/Quadrant" }], nullable: true }
        completedVia: { allOf: [{ $ref: "#/components/schemas/CompletionSource" }], nullable: true }
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Always absent on the board, which never shows a deleted task. It
            is here for the export, which includes them — a list that carried
            them without saying which would be worse than leaving them out.
        tags: { type: array, items: { type: string } }

    Plan:
      type: string
      enum: [FREE, PRO, SELF_HOSTED]

    User:
      type: object
      required:
        [id, username, language, timezone, showInLeaderboard, plan, planExpired, createdAt, stats]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email:
          type: string
          format: email
          nullable: true
          description: Absent until the user adds one.
        avatarUrl:
          type: string
          nullable: true
          description: |
            Null means the client renders an identicon from the username. The
            server does not generate one.
        language: { $ref: "#/components/schemas/Language" }
        timezone: { type: string }
        showInLeaderboard: { type: boolean }
        plan: { $ref: "#/components/schemas/Plan" }
        planExpired:
          type: boolean
          description: A trial that has run out. Every section but pricing is closed.
        createdAt: { type: string, format: date-time }
        stats: { $ref: "#/components/schemas/UserStats" }

    UserStats:
      type: object
      description: |
        A recomputable aggregate of the XP ledger and the activity log, read on
        every request rather than summed from the ledger each time.
      required:
        [lifetimeXp, level, currentStreak, longestStreak, tasksCreated, tasksCompleted,
         subtasksCompleted, linksCreated, achievementsUnlocked]
      properties:
        lifetimeXp: { type: integer, format: int64 }
        level: { type: integer, format: int32, minimum: 1 }
        currentStreak: { type: integer, format: int32 }
        longestStreak: { type: integer, format: int32 }
        tasksCreated: { type: integer, format: int32 }
        tasksCompleted: { type: integer, format: int32 }
        subtasksCompleted: { type: integer, format: int32 }
        linksCreated: { type: integer, format: int32 }
        achievementsUnlocked: { type: integer, format: int32 }

security:
  - accessCookie: []
    csrfToken: []
