# Vite dev server with HMR instead of nginx: `make dev`.

services:
  front:
    build:
      dockerfile: Dockerfile.dev
    image: cursed-matrix/front-dev:${IMAGE_TAG:-dev}
    # !override: otherwise compose merges in 8080 from the base file.
    ports: !override
      - "${VITE_PORT:-5173}:5173"
    volumes:
      # Anonymous node_modules volume survives recreation; `make dev-reset` renews it.
      - ./front:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  back:
    environment:
      APP_ENV: development
