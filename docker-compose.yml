# docker compose up -d --build       the application
# docker compose run --rm migrate up  migrations (one-shot, behind a profile)
# See docs/DEPLOY.md. Everything but FRONT_PORT is published on 127.0.0.1.

name: cursed-matrix

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  front:
    <<: [*restart, *logging]
    build:
      context: ./front
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-cursed-matrix}/front:${IMAGE_TAG:-dev}
    environment:
      BACKEND_HOST: back
      BACKEND_PORT: "8080"
    ports:
      - "${FRONT_PORT:-8080}:8080"
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  back:
    <<: [*restart, *logging]
    build:
      context: ./back
      dockerfile: Dockerfile
      args:
        GO_BUILD_LOWMEM: ${GO_BUILD_LOWMEM:-}
    image: ${IMAGE_REPO:-cursed-matrix}/back:${IMAGE_TAG:-dev}
    environment:
      CONFIG_PATH: /etc/cursed-matrix/config.yaml
      # Only exactly "production" gives the session cookies the Secure flag.
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      - ./back/config/config.yaml:/etc/cursed-matrix/config.yaml:ro
    networks: [edge, data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Healthcheck comes from the image. Grace > http.shutdown_timeout in config.yaml.
    stop_grace_period: 25s

  migrate:
    <<: *logging
    profiles: ["migrate"]
    build:
      context: ./back
      dockerfile: Dockerfile
      args:
        GO_BUILD_LOWMEM: ${GO_BUILD_LOWMEM:-}
    image: ${IMAGE_REPO:-cursed-matrix}/back:${IMAGE_TAG:-dev}
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      CONFIG_PATH: /etc/cursed-matrix/config.yaml
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./back/config/config.yaml:/etc/cursed-matrix/config.yaml:ro
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cursed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cursed_matrix}
      POSTGRES_INITDB_ARGS: "--data-checksums --locale=C.UTF-8 --encoding=UTF8"
      TZ: UTC
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "timezone=UTC"
      - "-c"
      - "log_min_duration_statement=200"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cursed} -d ${POSTGRES_DB:-cursed_matrix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      # noeviction: sessions must fail loudly, not vanish under memory pressure.
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  # --- monitoring: opt-in via COMPOSE_PROFILES=monitoring, ~420 MB ----------
  victoriametrics:
    <<: [*restart, *logging]
    profiles: ["monitoring"]
    image: victoriametrics/victoria-metrics:v1.152.0
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${VM_RETENTION:-15d}"
      - "-httpListenAddr=:8428"
      - "-promscrape.config=/etc/victoria-metrics/scrape.yml"
      - "-promscrape.configCheckInterval=30s"
      - "-memory.allowedPercent=${VM_MEMORY_PERCENT:-40}"
    volumes:
      - ./infra/victoria-metrics/scrape.yml:/etc/victoria-metrics/scrape.yml:ro
      - vm_data:/victoria-metrics-data
    ports:
      - "127.0.0.1:${VM_PORT:-8428}:8428"
    networks: [data, observability]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    <<: [*restart, *logging]
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [observability]
    depends_on:
      victoriametrics: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres-exporter:
    <<: [*restart, *logging]
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER:-cursed}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cursed_matrix}?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1,postgres,cursed_matrix_test"
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  redis-exporter:
    <<: [*restart, *logging]
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks: [data]
    depends_on:
      redis: { condition: service_healthy }

# front never reaches data; exporters never reach edge; back is on both.
networks:
  edge:
  data:
  observability:

volumes:
  pg_data:
  redis_data:
  vm_data:
  grafana_data:
