apiVersion: 1

providers:
  - name: cursed-matrix
    orgId: 1
    folder: cursed_matrix
    type: file
    disableDeletion: false
    # Dashboards are provisioned from a read-only mount: edits made in the UI
    # are not saved back. To change a panel, change the JSON in
    # infra/grafana/dashboards/ and it reloads within updateIntervalSeconds.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
